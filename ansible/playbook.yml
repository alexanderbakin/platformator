- name: Configure a Kubernetes node
  hosts: all
  become: true
  vars:
    k3s_version: latest
    cert_manager_version: latest
    kube_prometheus_stack_version: latest
    loki_version: latest
    alloy_version: latest
    sealed_secrets_version: latest
    # Path to key.yaml from sealed-secrets/generate-key.sh. Empty: the controller
    # makes its own key, and files sealed for another cluster will not open.
    sealed_secrets_key_file: ""
    # From `terraform output` (see the README, "Postgres and backups"). Empty:
    # no workload identity, and database backups cannot reach S3.
    service_account_issuer: "{{ lookup('env', 'SERVICE_ACCOUNT_ISSUER') }}"
    oidc_bucket: "{{ lookup('env', 'OIDC_BUCKET') }}"
    oidc_region: "{{ lookup('env', 'AWS_DEFAULT_REGION') }}"
  pre_tasks:
    - name: Check that the keys have a bucket to go to
      ansible.builtin.assert:
        that:
          - oidc_bucket | length > 0
          - oidc_region | length > 0
        fail_msg: SERVICE_ACCOUNT_ISSUER is set, so OIDC_BUCKET and AWS_DEFAULT_REGION must be set too
      when: service_account_issuer | length > 0
  tasks:
    - name: Ensure k3s config directory exists
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory

    - name: Install k3s config
      ansible.builtin.template:
        src: config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
      notify: Restart and enable k3s

    - name: Download k3s
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s
        mode: "0744"

    - name: Ensure k3s manifests directory exists
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/server/manifests
        state: directory

    - name: Download a cert-manager manifest
      ansible.builtin.get_url:
        url: "https://github.com/cert-manager/cert-manager/releases/{{ 'latest/download' if cert_manager_version == 'latest' else 'download/' + cert_manager_version }}/cert-manager.yaml"
        dest: /var/lib/rancher/k3s/server/manifests/01-cert-manager.yaml

    - name: Deploy a ClusterIssuer manifest
      ansible.builtin.template:
        src: cluster-issuer.yaml.j2
        dest: /var/lib/rancher/k3s/server/manifests/02-cluster-issuer.yaml

    - name: Deploy the monitoring stack manifest
      ansible.builtin.template:
        src: monitoring.yaml.j2
        dest: /var/lib/rancher/k3s/server/manifests/03-monitoring.yaml

    - name: Deploy the logging manifest (Loki and Alloy)
      ansible.builtin.template:
        src: logging.yaml.j2
        dest: /var/lib/rancher/k3s/server/manifests/04-logging.yaml

    - name: Install the Sealed Secrets key, so files sealed earlier open on this node
      ansible.builtin.copy:
        src: "{{ sealed_secrets_key_file }}"
        dest: /var/lib/rancher/k3s/server/manifests/05-sealed-secrets-key.yaml
        mode: "0600"
      no_log: true
      when: sealed_secrets_key_file | length > 0

    - name: Deploy the Sealed Secrets manifest
      ansible.builtin.template:
        src: sealed-secrets.yaml.j2
        dest: /var/lib/rancher/k3s/server/manifests/06-sealed-secrets.yaml

    - name: Install k3s
      ansible.builtin.command: /tmp/k3s
      environment:
        INSTALL_K3S_VERSION: "{{ '' if k3s_version == 'latest' else k3s_version }}"
      args:
        creates: /usr/local/bin/k3s
      notify: Restart and enable k3s

    - name: Start and enable k3s (self-healing in case handler's not triggered)
      ansible.builtin.systemd_service:
        name: k3s
        state: started
        enabled: true

    # Run the restart now, not at the end, so the issuer is in effect before
    # the keys are read.
    - name: Apply a changed k3s config
      ansible.builtin.meta: flush_handlers

    - name: Read the public keys that sign ServiceAccount tokens
      ansible.builtin.command: k3s kubectl get --raw /openid/v1/jwks
      register: service_account_keys
      until: service_account_keys.rc == 0
      retries: 30
      delay: 5
      changed_when: false
      when: service_account_issuer | length > 0

    # The keys are public and AWS reads them over HTTPS to check a token. They
    # change with every new cluster, so this runs on every play. It runs from
    # your machine, with your AWS credentials: the node has none.
    - name: Publish the public keys
      ansible.builtin.command:
        argv:
          - aws
          - s3
          - cp
          - "-"
          - "s3://{{ oidc_bucket }}/keys.json"
          - --content-type
          - application/json
          - --region
          - "{{ oidc_region }}"
      args:
        stdin: "{{ service_account_keys.stdout }}"
      delegate_to: localhost
      become: false
      changed_when: true
      when: service_account_issuer | length > 0

    - name: Fetch kubeconfig
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ playbook_dir }}/kubeconfig"
        flat: true

    - name: Point kubeconfig at the public IP instead of localhost
      ansible.builtin.replace:
        path: "{{ playbook_dir }}/kubeconfig"
        regexp: '127\.0\.0\.1'
        replace: "{{ ansible_host }}"
      delegate_to: localhost
      become: false

  handlers:
    - name: Restart and enable k3s
      ansible.builtin.systemd_service:
        name: k3s
        state: restarted
        enabled: true
