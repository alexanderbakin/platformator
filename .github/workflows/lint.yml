name: Lint

on:
  # Pushes to main and release tags run these checks through the "Publish
  # image" workflow, which publishes only if they pass.
  push:
    branches-ignore:
      - main
    tags-ignore:
      - "**"
    paths:
      - "operator/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "operator/**"
      - ".github/workflows/**"
  workflow_call:

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint

      # Fails when the code calls a function with a known vulnerability, in this
      # module or in a dependency or the standard library. It reports only what
      # is reachable, so it is quieter than a scan of go.mod alone.
      - name: Check for known vulnerabilities
        env:
          # renovate: datasource=go depName=golang.org/x/vuln
          GOVULNCHECK_VERSION: v1.1.4
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
